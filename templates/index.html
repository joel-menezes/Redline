<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redline</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #F8F9FA;
        }

        #rec{
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background-color: #c50000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            user-select: none;
            border: 8px inset #e60000;
            box-sizing: border-box;
        }
        
        #rec:hover{
            filter: brightness(0.85);
        }

        #scene{
            width: 125px;
            height: 50px;
            border-radius: 9999px;
            background-color: #252424;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            user-select: none;
            box-sizing: border-box;
        }

        .buttons p{
            margin: 0;
        }

        .buttons{
            width: 125px;
            height: 50px;
            gap: 10px;
            border-radius: 9999px;
            background-color: #252424;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            user-select: none;
            box-sizing: border-box;
            margin-top: 10px;
        }        
        
        #toast-container{
            position: fixed;
            bottom: 20px;
            right: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
        }
       

        .toast{
            width: 100%;
            box-sizing: border-box;
            background-color: rgba(50, 205, 50, 0.7);

            color: white;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast-success{
            width: 100%;
            box-sizing: border-box;
            background-color: rgba(50, 205, 50, 0.7);

            color: white;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast.show{
            opacity: 1;
            transform: translateY(0);
        }

        .head{
            position: fixed;
            top: 20px;
            right: 1%;
            width: 50px;
            height: 50px;
            text-align: center;
            padding: 10px 0;
            color: #6c757d;
            font-size: 14px;
            border-radius: 100%;
            background-color: #252424;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            user-select: none;
            box-sizing: border-box;
        }

        .button-container.show{
            opacity: 1;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .button-container{
            position: fixed;
            top: 50px;
            right: 1%;
            opacity: 0;
            transform: translateY(0px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #record-container{
            opacity: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* pointer-events: none; */
        }
        #record-container.show{
            opacity: 1;
            pointer-events: auto;
        }
    </style>

</head>
<body>
    <div id="record-container">
    <div id="rec">
        <p id="status">REC...</p>
    </div>
    <div id="curr_scene"> <p  id="curr_scene_text">Scene Name: Opening</p> </div>

    <div id="scene"><p> Reposition <p></div>
    <div id="toast-container"></div>
</div>
    <div class="head" id="settings">
        <span class="material-symbols-outlined">settings</span>
    </div>

    <div class="button-container" id="settings_container">
        <div class="buttons" id="record"> <p> Record <p></div>
        <div class="buttons" id="stream"> <p> Stream <p></div>
        <div class="buttons" id="settings_button"> <p> Settings <p></div>
    </div>
    

</body>

<script src = "https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
       function showToast(message, duration = 3000, status = "success") {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;

        container.appendChild(toast);

        toast.style.backgroundColor = "rgba(255, 50, 50, 0.7)";    
        if (status == "success") {
            toast.style.backgroundColor = "rgba(50, 205, 50, 0.7)";
        }else if (status == "error") {
            toast.style.backgroundColor = "rgba(255, 50, 50, 0.7)";
        } else if (status == "warning") {
            toast.style.backgroundColor = "rgba(255, 205, 50, 0.7)";
        }else{
            toast.style.backgroundColor = "rgba(0, 0, 0, 0.7)"; 
        }

        setTimeout(() => {
            toast.classList.add("show");
        }, 10);


        setTimeout(() => {
            toast.classList.remove("show");

            setTimeout(() => {
                toast.remove();

            }, 300);
        }, duration);
       }

       const settings = document.getElementById("settings");
       const settings_container = document.getElementById("settings_container");
        settings.addEventListener("click", () => {
            // showToast("Settings button isn't available yet!", 3000, "warning");
            settings_container.classList.toggle("show");    
        });


        const record_section = document.getElementById("record");
        const record_container = document.getElementById("record-container");
        record_section.addEventListener("click", () => {
           
            record_container.classList.toggle("show");    
        });

        const rec = document.getElementById("rec")
        rec.addEventListener("click", async() => {
            const response = await fetch("/record",{
                method: "POST"
            })
            const data = await response.json();
            if (data.success){
                console.log("Success");
            }
        })
        
        const change_scene = document.getElementById("scene")
        change_scene.addEventListener("click", async() => {
            const response = await fetch("/change_scene",{
                method: "POST"
            })

            const data = await response.json();

            if (data.success){
                console.log("Success");
            }
        })

        const socket = io();
        
        socket.on("obs_update", function(data){
            document.getElementById("status").textContent = data.message;
            if (data.message == "REC..."){
                rec.style.backgroundColor = "#c50000";
                rec.style.border =  "8px outset #e60000";
            }else{
               rec.style.backgroundColor = "#252424";
               rec.style.border =  "8px inset #334155";
            }
        });

        socket.on("scene_update", function(data){
            document.getElementById("curr_scene_text").textContent = "Scene Name: "  + data.message;
        });

        socket.on("notif", function(data){
           showToast(data.message, 3000, data.status);
        });
        
    </script>
</html>

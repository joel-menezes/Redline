<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redline</title>
    <style>
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #F8F9FA;
        }

        #rec{
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background-color: #c50000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            user-select: none;
            border: 8px inset #e60000;
            box-sizing: border-box;
        }
        
        #rec:hover{
            filter: brightness(0.85);
        }

        #scene{
            width: 125px;
            height: 50px;
            border-radius: 20%;
            background-color: #252424;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            user-select: none;
            border: 8px outset #334155;
            box-sizing: border-box;
        }

    </style>

</head>
<body>
    <div id="rec">
        <p id="status">REC...</p>
    </div>
    <div id="curr_scene"> <p  id="curr_scene_text">Scene Name: Opening</p> </div>

    <div id="scene"> <p> Reposition <p></div>
</body>

<script src = "https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
        const rec = document.getElementById("rec")
        rec.addEventListener("click", async() => {
            const response = await fetch("/record",{
                method: "POST"
            })
            const data = await response.json();
            if (data.success){
                console.log("Success");
            }
        })
        
        const change_scene = document.getElementById("scene")
        change_scene.addEventListener("click", async() => {
            const response = await fetch("/change_scene",{
                method: "POST"
            })

            const data = await response.json();

            if (data.success){
                console.log("Success");
            }
        })

        const socket = io();
        
        socket.on("obs_update", function(data){
            document.getElementById("status").textContent = data.message;
            if (data.message == "REC..."){
                 rec.style.backgroundColor = "#c50000";
                 rec.style.border =  "8px outset #e60000";
            }else{
               rec.style.backgroundColor = "#252424";
               rec.style.border =  "8px inset #334155";
            } 
        });

        socket.on("scene_update", function(data){
            document.getElementById("curr_scene_text").textContent = "Scene Name: "  + data.message;
        });
    </script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redline</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #F8F9FA;
        }

        #rec{
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background-color: #c50000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            user-select: none;
            border: 8px inset #e60000;
            box-sizing: border-box;
        }
        
        #rec:hover{
            filter: brightness(0.85);
        }

        #stream_button{
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background-color: #7A1CAC;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            user-select: none;
            border: 8px inset #E0A9FF;
            box-sizing: border-box;
        }
        
        #stream_button:hover{
            filter: brightness(0.85);
        }

        #scene{
            width: 125px;
            height: 50px;
            border-radius: 9999px;
            background-color: #252424;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            user-select: none;
            box-sizing: border-box;
        }

        .scene{
            width: 125px;
            height: 50px;
            border-radius: 9999px;
            background-color: #252424;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            user-select: none;
            box-sizing: border-box;
        }
        
        .preset{
            width: 125px;
            height: 50px;
            border-radius: 9999px;
            background-color: #252424;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            user-select: none;
            box-sizing: border-box;
        }

        .buttons p{
            margin: 0;
        }

        .buttons{
            width: 125px;
            height: 50px;
            gap: 10px;
            border-radius: 9999px;
            background-color: #252424;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            color: white;
            user-select: none;
            box-sizing: border-box;
            margin-top: 10px;
        }        
        
        #toast-container{
            position: fixed;
            bottom: 20px;
            right: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
        }
       

        .toast{
            width: 100%;
            box-sizing: border-box;
            background-color: rgba(50, 205, 50, 0.7);

            color: white;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast-success{
            width: 100%;
            box-sizing: border-box;
            background-color: rgba(50, 205, 50, 0.7);

            color: white;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast.show{
            opacity: 1;
            transform: translateY(0);
        }

        .head{
            position: fixed;
            top: 20px;
            right: 1%;
            width: 50px;
            height: 50px;
            text-align: center;
            padding: 10px 0;
            color: #6c757d;
            font-size: 14px;
            border-radius: 100%;
            background-color: #252424;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            user-select: none;
            box-sizing: border-box;
        }

        .button-container.show{
            opacity: 1;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .button-container{
            position: fixed;
            top: 50px;
            right: 1%;
            opacity: 0;
            transform: translateY(0px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #record-container{
            opacity: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #record-container.show{
            opacity: 1;
            pointer-events: auto;
        }

        #stream-container{
            opacity: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #stream-container.show{
            opacity: 1;
            pointer-events: auto;
        }

    
        .scene_changers{
            display:  flex;
            flex-direction:  row;
            flex-wrap: wrap;
            gap: 10px;
            align-content: center;
            justify-content: center;
            margin-top: 10px;
        }

        .hidden{
            display: none !important;
        }

        dialog{
            border: none;
            border-radius: 12px;
            padding: 20px;
            width: 50%;
            
        }
    #aligns{
        display: flex;
        flex-direction: row;
        gap: 10px;
        align-items: center;
        justify-content: center;
        text-align: center;
        }

        #close_settings_button{
             width: 125px;
            height: 50px;
            gap: 10px;
            border-radius: 9999px;
            background-color: #252424;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            user-select: none;
            box-sizing: border-box;
            margin-top: 10px;
            border: none;
        }
        
        .table-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .table-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            align-items: center;
            gap: 16px;
        }

        .header-row {
            font-weight: bold;
        }

        .table-row input,
        .table-row select{
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
        }

    </style>

</head>
<body>
    <div id="record-container">
        <div id="rec">
            <p id="status">REC...</p>
        </div>
        <div id="curr_scene"> <p  id="curr_scene_text">Scene Name: Opening</p> </div>


        <div id="scene_changers_record" class="scene_changers">
            
    </div>
    </div>

    <div id="stream-container" class="hidden">
        <div id="stream_button">
            <p id="status">STREAMING...</p>
        </div>
        <div id="curr_scene"> <p  id="curr_scene_text">Preview Scene Name: Opening</p> </div>
        <!-- <div id="curr_scene"> <p  id="curr_scene_text">Program Scene Name: Opening</p> </div> -->


        <div id="scene_changers_stream" class="scene_changers">
    </div>
</div>

    <div id="toast-container"></div>
</div>
    <div class="head" id="settings">
        <span class="material-symbols-outlined">settings</span>
    </div>

    <div class="button-container" id="settings_container">
        <div class="buttons" id="record"> <p> Record </p></div>
        <div class="buttons" id="stream"> <p> Stream</p></div>
        <div class="buttons" id="settings_button"> <p> Settings</p></div>
    </div>
    


    <dialog id="settings_box">
        <h2>Settings</h2>
        <div id="aligns">
            <div class="buttons" id="record"><p>Add Scene</p></div>
            <div class="buttons" id="stream"><p>Add Preset</p></div>
        </div>

        <br><br><br>
        <div class="table-container">
            <div class="table-row header-row">
                <span>Name</span>
                <span>Type</span>
                <span>Preset</span>
                <span>Scene</span>
                <span>Camera</span>
                <span>User</span>
                <span>Pass</span>
            </div>


        </div>

    
        <button id="close_settings_button">Close</button>
    </dialog>

</body>

<script src = "https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>

        const settings_open = document.querySelector("#settings_button")
        const settings_close = document.querySelector("#close_settings_button")
        const settings_box = document.querySelector("#settings_box")

        settings_open.addEventListener("click", () => {
            settings_box.showModal()
        })
        
        var change_preset = document.querySelectorAll(".preset")
        const stream_scene_presets = document.getElementById("scene_changers_stream");
        const stream_presets = [
            {name: "Ambo", data_preset: "1", data_scene: "Ambo"},
            {name: "Sanctuary", data_preset: "2", data_scene: "Sanctuary"}]

        var record_presets = [
            {name: "Ambo", data_preset: "1", data_scene: "Ambo"},
            {name: "Sanctuary", data_preset: "2", data_scene: "Sanctuary"}]



        const container = document.querySelector(".table-container")

        stream_presets.forEach(element => {
            var row = document.createElement('div')
            row.className = "table-row"

            row.innerHTML = `
                <input type="text" class="name" value="${element.name}"/>
                <p class="type">Preset</p>
                <input type="text" class="preset_input" value="${element.data_preset}"/>
                <input type="text" class="scene_input" value="${element.data_scene}"/>
                <input type="text" class="camera"/>
                <input type="text" class="user"/>
                <input type="text" class="pass"/>
            `
            container.appendChild(row);
        })

        settings_close.addEventListener("click", () => {
            
            const rows = document.querySelectorAll(".table-container .table-row");
            var updates = [];
            rows.forEach(row => {
                if (row.classList.contains("header-row")) return;

                const name = row.querySelector('.name').value;
                console.log(name);
                const type = row.querySelector('.type').textContent;
                const preset = row.querySelector('.preset_input').value;
                const scene = row.querySelector('.scene_input').value;
                const camera = row.querySelector('.camera').value;
                const user = row.querySelector('.user').value;
                const pass = row.querySelector('.pass').value;

                updates.push({
                    name: name,
                    type: type,
                    data_preset: preset,
                    data_scene: scene,
                    ip: camera,
                    user: user,
                    pass: pass,
                })
            })
            console.log(updates);
            
            stream_scene_presets.innerHTML = "";
            updates.forEach(element => {

                var button = document.createElement("div");
                button.classList.add("preset"); // Camera Position Button
                button.textContent = element.name; // Button Name
                button.id = element.name;
                button.setAttribute("data-preset", element.data_preset) // Camera Position
                button.setAttribute("data-scene", element.data_scene) // OBS Scene Correlation
                stream_scene_presets.appendChild(button); 
                
            });
            change_preset = document.querySelectorAll(".preset")
            change_preset.forEach(button => {
            button.addEventListener("click", async() => {
            const response = await fetch("/change_preset",{
                method: "POST",
                headers:{
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    onvif_ip: "127.0.0.1",
                    onvif_port: 80,
                    onvif_user: "admin",
                    onvif_pass: "admin",
                    onvif_preset: button.getAttribute("data-preset"),
                    scene_name: button.getAttribute("data-scene"),
                }),
            })

            const data = await response.json();
            console.log(data);

            if (data.success){
                console.log("Success");
            }
        })
        });
    settings_box.close()

        })

        // settings_box.addEventListener("click", (event) => {
        //     if (event.target == modal){
        //     settings_box.close()
        // }})
        
        
        

        stream_presets.forEach(element => {

            var button = document.createElement("div");
            button.classList.add("preset"); // Camera Position Button
            button.textContent = element.name; // Button Name
            button.id = element.name;
            button.setAttribute("data-preset", element.data_preset) // Camera Position
            button.setAttribute("data-scene", element.data_scene) // OBS Scene Correlation
            stream_scene_presets.appendChild(button); 

        })

        const stream_scenes = [
            {name: "Reposition", data_scene: "Ambo"},
        ]

        stream_scenes.forEach(element => {

            var button = document.createElement("div");
            button.classList.add("scene");
            button.textContent = element.name;
            button.id = element.name
            button.setAttribute("data-scene", element.data_scene)
            stream_scene_presets.appendChild(button); 

        })


        

        const record_scene_presets = document.getElementById("scene_changers_record");
        record_presets.forEach(element => {

            var button = document.createElement("div");
            button.classList.add("preset"); // Camera Position Button
            button.textContent = element.name; // Button Name
            button.id = element.name;
            button.setAttribute("data-preset", element.data_preset) // Camera Position
            button.setAttribute("data-scene", element.data_scene) // OBS Scene Correlation
            record_scene_presets.appendChild(button); 

        })

        const record_scenes = [
            {name: "Reposition", data_scene: "Ambo"},
        ]

        record_scenes.forEach(element => {

            var button = document.createElement("div");
            button.classList.add("scene");
            button.textContent = element.name;
            button.id = element.name
            button.setAttribute("data-scene", element.data_scene)
            record_scene_presets.appendChild(button); 

        })
       



        const record_button = document.getElementById("record")
        const stream_button = document.getElementById("stream")
        const record_container = document.getElementById("record-container")
        const stream_container = document.getElementById("stream-container")

        record_button.addEventListener("click", () => {
            record_container.classList.remove("hidden");
            stream_container.classList.add("hidden");
        })


        stream_button.addEventListener("click", () => {
            record_container.classList.add("hidden");
            stream_container.classList.remove("hidden");
        })


       function showToast(message, duration = 3000, status = "success") {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;

        container.appendChild(toast);

        toast.style.backgroundColor = "rgba(255, 50, 50, 0.7)";    
        if (status == "success") {
            toast.style.backgroundColor = "rgba(50, 205, 50, 0.7)";
        }else if (status == "error") {
            toast.style.backgroundColor = "rgba(255, 50, 50, 0.7)";
        } else if (status == "warning") {
            toast.style.backgroundColor = "rgba(255, 205, 50, 0.7)";
        }else{
            toast.style.backgroundColor = "rgba(0, 0, 0, 0.7)"; 
        }

        setTimeout(() => {
            toast.classList.add("show");
        }, 10);


        setTimeout(() => {
            toast.classList.remove("show");

            setTimeout(() => {
                toast.remove();

            }, 300);
        }, duration);
       }

       const settings = document.getElementById("settings");
       const settings_container = document.getElementById("settings_container");
        settings.addEventListener("click", () => {
            settings_container.classList.toggle("show");    
        });


       
        const rec = document.getElementById("rec")
        rec.addEventListener("click", async() => {
            const response = await fetch("/record",{
                method: "POST"
            })
            const data = await response.json();
            if (data.success){
                console.log("Success");
            }
        })
        
        const change_scene = document.querySelectorAll(".scene")
        change_scene.forEach(button => {
            button.addEventListener("click", async() => {
            const response = await fetch("/change_scene",{
                method: "POST",
                headers:{
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    scene_name: button.getAttribute("data-scene"),
                }),
            })

            const data = await response.json();
            console.log(data);

            if (data.success){
                console.log("Success");
            }
        })
        });
        
        
        change_preset.forEach(button => {
            button.addEventListener("click", async() => {
            const response = await fetch("/change_preset",{
                method: "POST",
                headers:{
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    onvif_ip: "127.0.0.1",
                    onvif_port: 80,
                    onvif_user: "admin",
                    onvif_pass: "admin",
                    onvif_preset: button.getAttribute("data-preset"),
                    scene_name: button.getAttribute("data-scene"),
                }),
            })

            const data = await response.json();
            console.log(data);

            if (data.success){
                console.log("Success");
            }
        })
        });
        

        const socket = io();
        
        socket.on("obs_update", function(data){
            document.getElementById("status").textContent = data.message;
            if (data.message == "REC..."){
                rec.style.backgroundColor = "#c50000";
                rec.style.border =  "8px outset #e60000";
            }else{
               rec.style.backgroundColor = "#252424";
               rec.style.border =  "8px inset #e60000"; // 334155
            }
        });

        socket.on("scene_update", function(data){
            document.getElementById("curr_scene_text").textContent = "Scene Name: "  + data.message;
        });

        socket.on("notif", function(data){
           showToast(data.message, 3000, data.status);
        });
        
    </script>
</html>
